<p class="eyebrow">סיפור גבורה</p><h1>ענבל ליברמן</h1><p class="sub">בת 25 · כיתת הכוננות בניר עוז</p><hr>
<p class="t">ענבל ליברמן הייתה בת 25 ביום השבעה באוקטובר. כבר בשעות הראשונות הבינה במהירות מה מתרחש וניסתה לטפל במצב בכל האפשרות. היא פיקדה על כיתת הכוננות של הקיבוץ, חימשה את חברי הכיתה ופעלה להגן על ניר עוז ותושביו.</p>
